workflows:
  ios-release:
    name: Walkaround iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Walkaround
    environment:
      groups:
        - code_signing
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      xcode: latest
      node: 22
    scripts:
      - name: Install and sync
        script: |
          npm install
          npx cap sync ios
      - name: Set up keychain
        script: keychain initialize
      - name: Create signing files
        script: |
          python3 - << 'PY'
          import json, subprocess
          raw = subprocess.check_output([
            "app-store-connect", "certificates", "list",
            "--type", "IOS_DISTRIBUTION", "--json"
          ], text=True)
          data = json.loads(raw)
          rows = data if isinstance(data, list) else data.get("data") or data.get("certificates") or []
          for row in rows:
            cid = row.get("id") if isinstance(row, dict) else None
            if cid:
              subprocess.run(["app-store-connect", "certificates", "delete", cid], check=False)
          PY
          app-store-connect fetch-signing-files "com.walkaround.app" \
            --type IOS_APP_STORE \
            --certificate-key="@env:CERTIFICATE_PRIVATE_KEY" \
            --create
      - name: Add certificates
        script: keychain add-certificates
      - name: Use signing profiles
        script: xcode-project use-profiles
      - name: Build the iPhone file
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
