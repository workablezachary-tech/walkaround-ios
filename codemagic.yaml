workflows:
  ios-release:
    name: Walkaround iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Walkaround
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.walkaround.app
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      xcode: latest
      node: 22
    scripts:
      - name: Install and sync
        script: |
          npm install
          npx cap sync ios
      - name: Use signing profiles
        script: xcode-project use-profiles
      - name: Build the iPhone file
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
